      <stop offset="1" stop-color="#ffb000" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="208" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="210" fill="#fbfaf7"/>
    <rect width="1200" height="210" fill="url(#grid)"/>
    <rect width="1200" height="210" fill="url(#glow)"/>
    <rect width="1200" height="44" fill="#f3f1ec"/>
    <path d="M0 44.5H1200" stroke="#e3ddd0"/>
  </g>
