    .ch { animation: show 0.01s steps(1) backwards; }
    .in { animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) backwards; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .pulse { animation: pulse 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes show { from { fill-opacity: 0; } }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.3); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

