  <text x="40" y="140" class="mono in" style="animation-delay:0.60s" font-size="17" fill="#3a3a3a">iskonnect/</text><text x="210" y="140" class="mono in" style="animation-delay:0.68s" font-size="17" fill="#3a3a3a">tailfinder/</text><text x="380" y="140" class="mono in" style="animation-delay:0.76s" font-size="17" fill="#3a3a3a">meu-gear-up/</text><text x="40" y="170" class="mono in" style="animation-delay:0.84s" font-size="17" fill="#3a3a3a">checkers/</text><text x="210" y="170" class="mono in" style="animation-delay:0.92s" font-size="17" fill="#3a3a3a">guhit-arts/</text>
