<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500" role="img" aria-labelledby="title desc">
  <title id="title">06 · more on my portfolio</title>
  <desc id="desc">See more of my work, my tech stack and how to reach me at fredanthonyyy.vercel.app.</desc>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', Consolas, 'Liberation Mono', Menlo, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .ch { animation: show 0.01s steps(1) backwards; }
    .in { animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) backwards; }
    .pop { animation: pop 0.45s cubic-bezier(0.22, 1, 0.36, 1) backwards; transform-box: fill-box; transform-origin: center; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .pulse { animation: pulse 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .beat { animation: beat 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes show { from { fill-opacity: 0; } }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
    @keyframes pop { from { opacity: 0; transform: scale(0.2); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.3); } }
    @keyframes beat { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.7); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#000000" stroke-opacity="0.05"/>
    </pattern>
    <radialGradient id="glow" cx="80%" cy="35%" r="60%">
      <stop offset="0" stop-color="#ffb000" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ffb000" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect x="1" y="1" width="598" height="498" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="600" height="500" fill="#fbfaf7"/>
    <rect width="600" height="500" fill="url(#grid)"/>
    <rect width="600" height="500" fill="url(#glow)"/>
    <rect width="600" height="44" fill="#f3f1ec"/>
    <path d="M0 44.5H600" stroke="#e3ddd0"/>
  </g>
  <rect x="0.5" y="0.5" width="599" height="499" rx="14" fill="none" stroke="#e3ddd0"/>
