  <desc id="desc">Role: Aspiring Full-Stack Developer. Course: BS Information Systems, 4th year. School: City College of Calapan. Location: Calapan City, Oriental Mindoro, Philippines. Stack: Flutter, React, Node.js, NestJS, PHP. Data: PostgreSQL, MySQL, Firebase, Supabase. Projects: 5, capstone ISKONNECT. Certifications: Java Programming NC III, Computer System Servicing NC II, Microsoft Cyber Security course. Status: open to internship or OJT.</desc>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', Consolas, 'Liberation Mono', Menlo, monospace; }
