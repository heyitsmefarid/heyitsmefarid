<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">$ whoami — Fred Anthony Gallano</title>
  <desc id="desc">Aspiring Full-Stack Developer, web and mobile. BS Information Systems student at City College of Calapan, open to internship or OJT.</desc>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', Consolas, 'Liberation Mono', Menlo, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .ch { animation: show 0.01s steps(1) backwards; }
    .in { animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) backwards; }
    .pop { animation: pop 0.45s cubic-bezier(0.22, 1, 0.36, 1) backwards; transform-box: fill-box; transform-origin: center; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .pulse { animation: pulse 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .beat { animation: beat 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes show { from { fill-opacity: 0; } }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
    @keyframes pop { from { opacity: 0; transform: scale(0.2); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.3); } }
    @keyframes beat { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.7); } }
    .boot { opacity: 0; animation: keep 2.6s steps(1); }
    .main { animation: show-g 0.01s steps(1) backwards; animation-delay: 2.6s; }
    .bar { animation: fill 1.1s cubic-bezier(0.22, 1, 0.36, 1) backwards; animation-delay: 1.3s; transform-box: fill-box; transform-origin: left; }
    .blade { animation: blade 1.15s cubic-bezier(0.77, 0, 0.18, 1) both; }
    .role { animation: role 10.4s linear infinite backwards; }
    @keyframes keep { from, to { opacity: 1; } }
    @keyframes show-g { from { opacity: 0; } }
    @keyframes fill { from { transform: scaleX(0); } }
    @keyframes blade {
      0% { transform: translateX(-1800px); }
      42%, 58% { transform: translateX(-250px); }
      100% { transform: translateX(1400px); }
    }
    @keyframes role { 0% { opacity: 0; } 3%, 22% { opacity: 1; } 25%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .boot, .blade { display: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  
