# Redraws the contribution snake in the profile README once a day, in the
# portfolio's greens, and publishes it to the `output` branch.
name: Contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#0e3a2d&color_dots=#dcebe0,#a9c9b5,#77a38d,#3f6f5a,#0e3a2d
            dist/snake-dark.svg?palette=github-dark&color_snake=#cfeedb&color_dots=#123a2e,#2f5f4d,#5f8f7a,#97c3ad,#cfeedb

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
