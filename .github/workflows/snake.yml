# Redraws the contribution snake in the profile README once a day, in the
# portfolio's amber colours, and publishes it to the `output` branch.
name: Contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#9a5a00&color_dots=#ebe8e1,#fde2a3,#f8c14f,#e39400,#9a5a00
            dist/snake-dark.svg?palette=github-dark&color_snake=#ffb000&color_dots=#1a1a1a,#4c380c,#7c5809,#b98106,#ffb000

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
